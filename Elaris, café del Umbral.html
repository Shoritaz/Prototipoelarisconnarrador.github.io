*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;color:var(--ink);font:400 17px/1.65 var(--sans);overflow-x:hidden;background:radial-gradient(70% 50% at 85% 5%,rgba(155,93,229,.28),transparent),radial-gradient(60% 40% at 5% 95%,rgba(232,185,62,.12),transparent),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(7,5,12,.94);z-index:40}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.1}
h1:focus{outline:0}
p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.gold{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#a87a14);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{background:var(--logo) center/contain no-repeat;mix-blend-mode:screen}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding:8px 4vw;background:rgba(7,5,12,.9);backdrop-filter:blur(8px);border-bottom:1px solid rgba(232,185,62,.35)}
nav .logo{width:48px;height:48px;flex:none}
nav div{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:1px solid transparent;color:var(--mute);font:600 15px var(--serif);padding:8px 14px;cursor:pointer;white-space:nowrap;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
nav button:hover{color:var(--gold2)}
nav button.on{color:#1a1226;background:linear-gradient(180deg,var(--gold2),var(--gold))}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:6vh 5vw 10vh}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;min-height:62vh}
.hero h1{font-size:clamp(3.6rem,11vw,8rem);letter-spacing:.06em;font-weight:900}
.hero .sub{font:500 1.2rem var(--serif);color:var(--lav);margin:8px 0 18px}
.hero p.tx{max-width:32em;color:#dcd2f0;margin-bottom:28px}
.hero .big{width:min(100%,440px);aspect-ratio:1;justify-self:center;animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(155,93,229,.55))}
@keyframes fl{50%{transform:translateY(-14px) rotate(1.5deg)}}
.btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1226;border:0;padding:14px 34px;margin:0 10px 10px 0;font:900 17px var(--serif);cursor:pointer;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.btn.alt{background:none;color:var(--gold2);box-shadow:inset 0 0 0 1px var(--gold)}
.tiles,.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.tiles{margin-top:6vh}
.card{background:var(--panel);border:1px solid rgba(232,185,62,.38);color:var(--ink);padding:24px;font:inherit;text-align:left;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px))}
button.card{cursor:pointer;transition:transform .2s,border-color .2s}
button.card:hover{transform:translateY(-6px);border-color:var(--acc)}
.card h3{font-size:1.5rem;color:var(--gold2);margin:8px 0 6px}
.card p{color:var(--mute);font-size:.96rem}
.ic{font-size:2.2rem;display:block}
h2.t{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:900;margin-bottom:8px}
.lead{color:var(--mute);max-width:40em;margin-bottom:34px}
.chap{display:grid;grid-template-columns:90px 1fr;gap:20px;padding:22px 0;border-top:1px solid rgba(232,185,62,.3)}
.chap b{font:900 2.4rem var(--serif);color:var(--gold)}
.chap h3{font-size:1.5rem;margin-bottom:6px}
.chap p{color:#d4c9ea;max-width:42em}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 36px}
.chips span{padding:6px 16px;border:1px solid var(--lav);color:var(--lav);font:600 14px var(--serif);border-radius:30px}
.cc .arch{height:150px;margin-bottom:12px}
.arch{border-radius:200px 200px 0 0;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--acc) 55%,#0c0818),#0c0818 75%);border:2px solid var(--acc);display:grid;place-items:center;position:relative;overflow:hidden}
.arch span{font-size:3.6rem;position:relative}
.arch b{position:absolute;font:900 14rem/1 var(--serif);color:var(--acc);opacity:.14;bottom:-2rem}
.cc small{color:var(--acc);font:700 14px var(--serif)}
.back{background:none;border:0;color:var(--gold2);font:600 16px var(--serif);cursor:pointer;margin-bottom:18px;padding:6px 0}
.det{display:grid;grid-template-columns:.8fr 1.2fr;gap:26px;align-items:start}
.arch.big{height:min(460px,60vh)}
.arch.big span{font-size:6rem}
.note{font-size:.85rem;color:var(--mute);margin-top:10px}
.st .cl{color:var(--acc);font:700 1rem var(--serif)}
.st h1{font-size:clamp(3rem,8vw,5rem);font-weight:900;margin:4px 0}
.st q{display:block;margin:14px 0 18px;font-size:1.1rem;color:var(--lav);quotes:"“" "”"}
.st h3{font-size:1.15rem;color:var(--gold2);margin:20px 0 8px}
.stat{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;font-size:.92rem}
.bar{height:8px;background:#2a1f40}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--gold2));transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.st ul{margin:0;padding-left:20px;color:#d4c9ea}
.st li{margin-bottom:6px}
.rumor{margin-top:18px;padding:12px 16px;border-left:3px solid var(--acc);background:rgba(255,255,255,.04);font-style:italic;color:var(--lav)}
.rar{font:700 13px var(--serif)}
.rank{display:inline-grid;place-items:center;width:46px;height:46px;font:900 1.6rem var(--serif);color:#1a1226;background:var(--acc);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.q{display:grid;grid-template-columns:60px 1fr;gap:18px;align-items:center;margin-bottom:14px}
#load{position:fixed;inset:0;z-index:60;display:grid;place-items:center;align-content:center;gap:14px;text-align:center;padding:20px;background:linear-gradient(115deg,transparent 40%,rgba(232,185,62,.1) 40% 46%,transparent 46%),radial-gradient(circle at 50% 40%,#1b0f33,var(--bg) 70%);opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s}
#load.on{opacity:1;visibility:visible;transition:opacity .25s}
.orb{position:relative;width:210px;height:210px;display:grid;place-items:center}
.orb::before,.orb::after{content:"";position:absolute;border-radius:50%}
.orb::before{inset:0;border:2px dashed var(--gold);animation:sp 9s linear infinite}
.orb::after{inset:20px;border:3px dotted var(--lav);animation:sp 6s linear infinite reverse}
.orb .logo{width:130px;height:130px}
@keyframes sp{to{transform:rotate(360deg)}}
#load h2{font-size:2rem;letter-spacing:.3em;font-weight:900}
#lt{color:var(--lav)}
.track{width:min(420px,80vw);height:6px;background:#2a1f40}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--vio),var(--gold2))}
#pc{font:700 15px var(--serif);color:var(--gold2)}
#tip{max-width:30em;color:var(--mute);font-size:.92rem}
@media(max-width:780px){.hero,.det{grid-template-columns:1fr}.hero .big{order:-1;width:220px}.chap{grid-template-columns:56px 1fr}.stat{grid-template-columns:78px 1fr 30px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.stage{position:relative;height:min(88vh,720px);overflow:hidden;border:1px solid rgba(232,185,62,.5);background:#07050c;--sp:1;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px))}
.stage .bg{position:absolute;inset:-5%;transition:filter .6s;background:radial-gradient(circle at 50% 38%,rgba(255,226,150,.3),transparent 46%),linear-gradient(#1a0e2b,#07050c)}
.stage .bg::before,.stage .bg::after{content:"";position:absolute;top:0;bottom:0;width:24%;background:repeating-linear-gradient(0deg,rgba(0,0,0,.6) 0 5px,transparent 5px 104px),repeating-linear-gradient(90deg,#5a2d4b 0 12px,#2b2147 12px 20px,#7a5a22 20px 27px,#1e3b4a 27px 40px,#6b2b3a 40px 46px,#3a2a63 46px 58px)}
.stage .bg::before{left:0}.stage .bg::after{right:0;transform:scaleX(-1)}
.win{position:absolute;left:50%;top:4%;width:36%;height:62%;transform:translateX(-50%);border-radius:300px 300px 0 0;border:3px solid rgba(232,185,62,.55);background:radial-gradient(circle at 50% 75%,rgba(190,150,255,.5),rgba(40,20,80,.15) 70%)}
.books span{position:absolute;font-size:2.1rem;left:var(--x);top:var(--y);animation:bk calc(6s/var(--sp)) ease-in-out infinite;animation-delay:var(--d);opacity:.9}
@keyframes bk{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-24px) rotate(calc(var(--r)*-1))}}
.fx{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.eyewrap{position:absolute;left:50%;top:3%;height:56%;aspect-ratio:285/438;transform:translateX(-50%);animation:idle 4s ease-in-out infinite}
@keyframes idle{50%{transform:translate(-50%,-12px)}}
@keyframes trem{0%{transform:translate(calc(-50% - 5px),0)}50%{transform:translate(calc(-50% + 5px),3px)}100%{transform:translate(calc(-50% - 3px),-3px)}}
.eye{position:absolute;inset:0;background:var(--eye) center/100% 100% no-repeat;-webkit-mask-image:radial-gradient(ellipse 58% 44% at 50% 60%,#000 38%,transparent 72%);mask-image:radial-gradient(ellipse 58% 44% at 50% 60%,#000 38%,transparent 72%);transition:filter .45s,transform .45s}
#bub{position:absolute;right:-6%;top:18%;font-size:2.4rem;animation:pop .5s}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.4)}}
.box{position:absolute;left:3%;right:3%;bottom:3%;padding:16px 22px 18px;background:rgba(10,6,20,.92);border:1px solid var(--gold);cursor:default;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.nm{font:900 1.1rem var(--serif);margin-bottom:4px}
#txt{min-height:3.4em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:10px}
.opts[hidden]{display:none}
.opts button{background:rgba(232,185,62,.08);border:1px solid rgba(232,185,62,.6);color:var(--ink);font:600 15px var(--sans);padding:9px 14px;cursor:pointer;text-align:left}
.opts button:hover{background:var(--gold);color:#1a1226}
.opts button.bk{border-color:var(--mute);color:var(--mute)}
.m-happy .bg{filter:saturate(1.4) brightness(1.25) sepia(.3)}.m-happy{--sp:2.2}
.m-happy .eye{filter:brightness(1.25) saturate(1.5);transform:scale(1.08) translateY(-8px)}
.m-angry .bg{filter:url(#warp) hue-rotate(-75deg) saturate(1.9) brightness(.8)}.m-angry{--sp:5}
.m-angry .eyewrap{animation:trem .12s linear infinite}
.m-angry .eye{filter:hue-rotate(160deg) saturate(2) brightness(1.1);transform:scale(1.14)}
.m-angry .fx{opacity:1;background:radial-gradient(circle,transparent 30%,rgba(255,0,40,.5))}
.m-shy .bg{filter:hue-rotate(-35deg) saturate(1.3) brightness(1.1)}
.m-shy .eye{filter:hue-rotate(105deg) brightness(1.1);transform:scale(.88) rotate(-6deg)}
.m-shy .fx{opacity:1;background:radial-gradient(circle,transparent 40%,rgba(255,130,190,.35))}
.m-sad .bg{filter:saturate(.35) brightness(.65) hue-rotate(20deg)}.m-sad{--sp:.4}
.m-sad .eye{filter:grayscale(.55) brightness(.75);transform:translateY(14px) scale(.92)}
.m-sad .fx{opacity:1;background:linear-gradient(rgba(20,40,90,.45),transparent)}
.m-sly .bg{filter:hue-rotate(80deg) saturate(1.4) brightness(.85)}
.m-sly .eye{filter:hue-rotate(-90deg) saturate(1.3);transform:scale(1.1,.88) rotate(5deg)}
.m-sly .fx{opacity:1;background:radial-gradient(circle,transparent 35%,rgba(60,200,90,.3))}
.m-wow .bg{filter:brightness(1.5) saturate(1.3)}.m-wow{--sp:3}
.m-wow .eye{filter:brightness(1.5);transform:scale(1.22)}
.m-wow .fx{background:#fff;animation:fl2 .7s both}
@keyframes fl2{0%{opacity:.9}100%{opacity:0}}
@media(max-width:780px){.stage{height:min(92vh,760px)}.eyewrap{height:38%}.win{height:48%}.opts button{padding:8px 12px;font-size:14px}.box{padding:12px 14px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="warp"><feTurbulence type="fractalNoise" baseFrequency=".008 .02" numOctaves="1" seed="3"><animate attributeName="baseFrequency" dur="1.4s" values=".008 .02;.02 .05;.008 .02" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" scale="38"/></filter></svg>
<canvas id="petals" aria-hidden="true"></canvas>
<nav id="nav"><div class="logo" role="img" aria-label="Logotipo de Elaris"></div><div id="links"></div></nav>
<main id="view"></main>
<div id="load" role="status" aria-live="polite"><div class="orb"><div class="logo"></div></div><h2 class="gold">CARGANDO</h2><p id="lt"></p><div class="track"><div id="bar"></div></div><p id="pc">0%</p><p id="tip"></p></div>
<script>
const $=s=>document.querySelector(s),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const NAV=[["inicio","Inicio"],["mundo","El Mundo"],["elenco","Elenco"],["carta","Carta"],["misiones","Misiones"],["gremio","Gremio"]];
const LB={inicio:"Volviendo al salón…",mundo:"Cruzando el Umbral…",elenco:"Convocando al elenco…",carta:"Abriendo la carta de mareas…",misiones:"Consultando el tablón del gremio…",gremio:"Abriendo el registro del gremio…"};
const TIPS=["Las flores de Elaris solo se abren para quien llega con ganas de escuchar historias.","El reloj del salón se detiene al cruzar el Umbral.","Toda mesa guarda un sitio junto a la ventana para quien aún no ha llegado.","Nadie recuerda quién fundó Elaris, pero todos recuerdan su primera taza."];
const ST=["Encanto","Servicio","Magia","Aguante"];
const CAST=[
{n:"Seren",cl:"Camarera Arcana, jefa de sala",lv:42,c:"#ff7eb6",f:"🌸",fl:"peonía rosada",s:[88,97,64,70],q:"En Elaris nadie bebe solo.",o:"Reencarnada desde el mundo de los mortales: era bibliotecaria nocturna hasta que un carrito de libros la envió directa al Umbral.",k:["Bienvenida Eterna: recuerda el nombre y el gusto de cada visitante.","Taza Cálida: devuelve el ánimo a toda la mesa.","Mirada de Jefa: silencia un salón entero sin alzar la voz."],r:"Dicen que guarda en el delantal una llave que abre la despensa de otro mundo."},
{n:"Valdric",cl:"Caballero Mayordomo",lv:57,c:"#7aa2ff",f:"🪷",fl:"loto de plata",s:[70,95,55,99],q:"Servir es una forma de proteger.",o:"Último caballero de la Corte del Alba. Perdió su reino y juró custodiar el Umbral a cambio de un sitio en el café.",k:["Guardia del Umbral: ningún mal paso cruza la puerta.","Etiqueta Impecable: transforma cualquier cena en ceremonia.","Reloj Sin Hora: detiene el tiempo unos segundos."],r:"Su reloj de bolsillo marca una hora que no existe en ningún reino."},
{n:"Mina",cl:"Alquimista barista",lv:35,c:"#5fe9d0",f:"🪻",fl:"lavanda lunar",s:[80,75,96,50],q:"Cada taza es un mapa; solo hay que saber leerlo.",o:"Aprendiz de hechicera que tropezó con una máquina de café en su mundo y despertó entre las flores de Elaris.",k:["Infusión de Marea: el sabor cambia con el ánimo de quien la bebe.","Receta Accidental: inventa un brebaje nuevo cada vez que se equivoca.","Espuma Estelar: dibuja constelaciones en el café."],r:"Su cuaderno de recetas se reescribe solo cada luna nueva."},
{n:"Ashe",cl:"Bardo de la Tormenta",lv:48,c:"#ffc857",f:"🌻",fl:"girasol del alba",s:[92,80,72,66],q:"El escenario es de quien se atreve a pisarlo.",o:"Trovadora errante que llegó en plena tormenta con una guitarra rota. Se quedó a arreglarla y nunca se fue.",k:["Voz del Escenario: contagia valor a quien sube a cantar.","Silencio Compasivo: sabe cuándo callar y escuchar.","Acorde de Valor: refuerza a todo el gremio."],r:"Su guitarra rota suena sola cuando alguien cruza el Umbral."}];
const MENU=[["Té de Pétalos Lunares","Épico","#c77dff","Infusión de flores que solo se recogen de noche. Calma, y a veces hace soñar."],["Latte del Alba Dormida","Raro","#6c8cff","Leche de nube y canela de otro reino, con arte de estrellas."],["Tarta de Cerezo del Umbral","Legendario","#e8b93e","Su receta pertenece a la Reina Ausente. Se sirve de una en una."],["Poción de Menta y Miel","Común","#b3a6cc","Para recuperar el aliento tras una buena aventura."],["Scones del Gremio","Común","#b3a6cc","Calientes, con mermelada de moras violetas."],["Infusión de Estrella Blanca","Legendario","#e8b93e","Un solo sorbo y la sala entera se queda en silencio."]];
const V={
inicio:()=>`<section class="hero"><div><h1 class="gold" tabindex="-1">ELARIS</h1><p class="sub">Café del Umbral, entre mundos</p><p class="tx">Una puerta que se abre al caer la última luz de la tarde. Dentro te esperan flores que brillan, un servicio de otro tiempo y un gremio de historias. Pasa, que la taza ya está servida.</p><button class="btn" data-go="mundo">Cruzar el Umbral</button><button class="btn alt" data-go="elenco">Conocer al elenco</button></div><div class="big logo" role="img" aria-label="Logotipo de Elaris"></div></section>
<div class="tiles">${[["🌌","mundo","La Crónica","La historia del café y del mundo que lo rodea."],["👑","elenco","El Elenco","Fichas de cada integrante, con nivel y habilidades."],["🍵","carta","La Carta","Pociones, tés y banquetes por rareza."],["📜","misiones","El Tablón","Eventos y misiones de la semana."]].map(t=>`<button class="card" data-go="${t[1]}"><span class="ic">${t[0]}</span><h3>${t[2]}</h3><p>${t[3]}</p></button>`).join("")}</div>`,
mundo:()=>`<h1 class="t gold" tabindex="-1">El Mundo de Elaris</h1><p class="lead">Los viajeros de otros mundos llegan sin saber cómo. Los que se quedan acaban con delantal.</p><div class="chips">${["Valle de Lavanda","Bosque Espejo","Ciudad de Latón","Mar de Estrellas"].map(x=>`<span>${x}</span>`).join("")}</div>${[["El Umbral abierto","Hace tres lunas llenas se abrió una grieta entre dos mundos. Flotaba en ella un invernadero abandonado con una sola mesa puesta. Así nació Elaris."],["La Corona Viva","El laurel violeta que rodea la E crece solo y cambia de forma con las estaciones. Se dice que protege el café de quien llega con malas intenciones."],["La Reina Ausente","La corona dorada sobre la E no tiene cabeza. Su dueña dejó el café en herencia a quien supiera servir una taza sin esperar nada. Nadie sabe si volverá."],["El Pacto del Servicio","Quien viste el uniforme jura cuidar de la mesa como si fuera la suya. A cambio, Elaris le guarda el nombre, un sitio y, si hace falta, el camino a casa."]].map((c,i)=>`<div class="chap"><b>${["I","II","III","IV"][i]}</b><div><h3 class="gold">${c[0]}</h3><p>${c[1]}</p></div></div>`).join("")}`,
elenco:()=>`<h1 class="t gold" tabindex="-1">El Elenco</h1><div class="stage m-calm" id="stage"><div class="bg"></div><div class="win"></div><div class="books" aria-hidden="true">${["📖","📕","📗","📘","📜","📚","📙","📖","📕"].map((b,i)=>`<span style="--x:${(i*11+4)%88}%;--y:${6+(i*29)%50}%;--r:${(i%2?1:-1)*(12+i*4)}deg;--d:${-i*.7}s">${b}</span>`).join("")}</div><div class="fx"></div><div class="eyewrap"><div class="eye" role="img" aria-label="El Ojo, narrador de Elaris"></div><span id="bub" aria-hidden="true"></span></div><div class="box" id="box"><p class="nm gold">El Ojo</p><p id="txt" aria-live="polite"></p><div class="opts" id="opts" hidden></div></div></div><p class="note">Elenco y diálogos de ejemplo. Toca el texto para saltar la animación.</p>`,
ficha:i=>{const m=CAST[i];return `<div style="--acc:${m.c}"><button class="back" data-go="elenco:cast">Volver al elenco</button><div class="det"><div><div class="arch big"><b>${m.n[0]}</b><span>${m.f}</span></div><p class="note">Hueco para el render de ${m.n}.</p></div><div class="card st"><p class="cl">${m.cl}</p><h1 class="gold" tabindex="-1">${m.n}</h1><p>Nivel ${m.lv}. Flor emblema: ${m.fl}.</p><q>${m.q}</q>${ST.map((s,j)=>`<div class="stat"><span>${s}</span><div class="bar"><i data-w="${m.s[j]}"></i></div><b>${m.s[j]}</b></div>`).join("")}<h3>Habilidades</h3><ul>${m.k.map(k=>`<li>${k}</li>`).join("")}</ul><h3>Origen</h3><p>${m.o}</p><p class="rumor">Rumor del salón: ${m.r}</p></div></div></div>`},
carta:()=>`<h1 class="t gold" tabindex="-1">La Carta de Mareas</h1><p class="lead">Cada plato tiene su rareza. Cambia con la marea de la bahía invisible.</p><div class="grid">${MENU.map(x=>`<div class="card" style="--acc:${x[2]}"><span class="rar" style="color:${x[2]}">${x[1]}</span><h3>${x[0]}</h3><p>${x[3]}</p></div>`).join("")}</div>`,
misiones:()=>`<h1 class="t gold" tabindex="-1">El Tablón del Gremio</h1><p class="lead">Misiones de ejemplo; ajusta días y horarios a los del café.</p>${[["B","#c77dff","Viernes: Noche de Open Mic","Ashe abre el escenario. Canta, recita o cuenta una historia en personaje."],["F","#5fe9d0","Domingo: Té en el Umbral","Tarde tranquila para aventureros nuevos. Mina y Seren os enseñan el salón."],["S","#e8b93e","Mensual: Banquete de la Reina Ausente","Cena de gala con mesa reservada y mayordomo asignado."]].map(q=>`<div class="card q" style="--acc:${q[1]}"><span class="rank">${q[0]}</span><div><h3>${q[2]}</h3><p>${q[3]}</p></div></div>`).join("")}`,
gremio:()=>`<h1 class="t gold" tabindex="-1">El Gremio de Elaris</h1><p class="lead">Rangos de ejemplo para quien quiera apoyar el café cada mes.</p><div class="grid">${[["Aventurero","#c58a4a","Acceso al salón y al Discord, y voto en la carta de mareas."],["Caballero de Té","#cfd6e6","Mesa preferente, rol propio y nombre en el tablón."],["Noble del Umbral","#e8b93e","Mayordomo personal, banquetes y una silla con tu nombre."]].map(r=>`<div class="card" style="--acc:${r[1]}"><h3 style="color:${r[1]}">${r[0]}</h3><p>${r[2]}</p></div>`).join("")}</div><p style="margin-top:34px"><button class="btn" onclick="return false">Unirse al Discord</button></p>`};
const MOODS={calm:"✦",happy:"✨",angry:"💢",shy:"💦",sad:"💧",sly:"😏",wow:"❗"};
const LN=[["Ah, Seren… la jefa de sala. Si te sonríe, ya eres de la casa; si te mira serio, mejor ordena tu mesa.","shy"],["Valdric, el mayordomo mayor. Habla poco, pero nunca llega tarde ni olvida una deuda.","calm"],["¡Mina! La alquimista barista. Cuidado con sus recetas, que a veces explotan… de sabor.","wow"],["Ashe, la bardo. Cuando canta, hasta los libros dejan de cuchichear.","happy"]];
const BK=["Volver atrás","@back"];
const MORE=[["Ver su ficha completa","@ficha."],["Preguntar por otro","cast"],BK];
function NODE(id){
  const [k,i]=id.split("."),m=CAST[i],F=()=>[["Ver su ficha completa","@ficha."+i],["Preguntar por otro","cast"],BK];
  const S={
  start:{m:"calm",t:"¡Bienvenido, alma perdida! Soy el Ojo, narrador de Elaris y guardián de esta biblioteca. ¿Te gustaría conocer al elenco que conforma este lugar?",o:[["Sí, me encantaría","cast"],["¿Quién eres tú exactamente?","who"],["Me das un poco de miedo…","scary"],["No, solo estaba mirando","no"]]},
  who:{m:"shy",t:"Un ojo con ínfulas de escritor. Llevo siglos leyendo a quienes cruzan el Umbral y hoy me toca presentarte a todos. No me mires tanto, que me sonrojo.",o:[["Vale, preséntamelos","cast"],BK]},
  scary:{m:"sad",t:"¿Miedo? Qué cruel… Solo soy un ojo, unas llamas azules y mucho amor por los libros. Si quieres, te enseño a gente más simpática.",o:[["Perdona, enséñamelos","cast"],BK]},
  no:{m:"angry",t:"¡¿SOLO MIRANDO?! ¡Llevo toda la tarde ordenando estos estantes para recibirte! ¡Hasta los libros tiemblan de indignación!",o:[["Era broma, perdón","cast"],BK]},
  cast:{m:"happy",t:"¡Estupendo! Aquí trabajan cuatro almas: Seren, la jefa de sala; Valdric, el mayordomo; Mina, la barista alquimista; y Ashe, la bardo. ¿Por quién quieres empezar?",o:[...CAST.map((c,j)=>[c.n,"p."+j]),BK]},
  p:()=>({m:LN[i][1],t:LN[i][0],o:[["¿De dónde viene?","o."+i],["¿Qué sabe hacer?","k."+i],["Cuéntame un rumor","r."+i],...F()]}),
  o:()=>({m:"calm",t:"Según mis crónicas: "+m.o,o:[["¿Qué sabe hacer?","k."+i],["Cuéntame un rumor","r."+i],...F()]}),
  k:()=>({m:"wow",t:"Sus habilidades, escritas en mis páginas. "+m.k.join(" "),o:[["¿De dónde viene?","o."+i],["Cuéntame un rumor","r."+i],...F()]}),
  r:()=>({m:"sly",t:"Psst… "+m.r+" Pero yo no te he dicho nada.",o:[["¿De dónde viene?","o."+i],["¿Qué sabe hacer?","k."+i],...F()]})};
  const n=S[k];return typeof n==="function"?n():n;
}
const ST2=[];let tw,skip=()=>{};
function vn(id,push=true){
  if(push)ST2.push(id);
  const n=NODE(id);
  $("#stage").className="stage m-"+n.m;
  const b=$("#bub");b.textContent=MOODS[n.m];b.style.animation="none";void b.offsetWidth;b.style.animation="";
  const o=$("#opts"),tx=$("#txt");o.hidden=true;tx.textContent="";clearInterval(tw);let c=0;
  const fin=()=>{clearInterval(tw);skip=()=>{};tx.textContent=n.t;o.innerHTML=n.o.map(x=>`<button class="${x[1]==="@back"?"bk":""}" data-n="${x[1]}">${x[0]}</button>`).join("");o.hidden=false};
  if(rm){fin();return}
  skip=fin;tw=setInterval(()=>{tx.textContent=n.t.slice(0,++c);if(c>=n.t.length)fin()},22);
}
document.addEventListener("click",e=>{
  if(e.target.closest("#box")&&!e.target.closest("[data-n]"))skip();
  const b=e.target.closest("[data-n]");if(!b)return;
  const id=b.dataset.n;
  if(id==="@back"){if(ST2.length>1){ST2.pop();vn(ST2[ST2.length-1],false)}}
  else if(id.startsWith("@ficha."))go("ficha",id.split(".")[1]);
  else vn(id);
});
let busy=false;
function draw(to,arg){
  $("#view").innerHTML=V[to](arg);
  document.querySelectorAll("#links button").forEach(b=>b.classList.toggle("on",b.dataset.go===(to==="ficha"?"elenco":to)));
  scrollTo(0,0);if(to==="elenco"){ST2.length=0;if(arg==="cast")ST2.push("start");vn(arg==="cast"?"cast":"start")}
  setTimeout(()=>document.querySelectorAll(".bar i").forEach(i=>i.style.width=i.dataset.w+"%"),80);
}
function go(to,arg){
  if(busy)return;busy=true;
  const label=to==="ficha"?`Invocando a ${CAST[arg].n}…`:LB[to],short=to==="ficha";
  $("#lt").textContent=label;$("#tip").textContent=TIPS[Math.random()*TIPS.length|0];
  const L=$("#load");L.classList.add("on");
  const dur=rm?250:short?900:1400,t0=performance.now();let sw=false;
  (function f(n){
    const p=Math.min((n-t0)/dur,1),e=1-Math.pow(1-p,3);
    $("#bar").style.width=e*100+"%";$("#pc").textContent=Math.round(e*100)+"%";
    if(p>.55&&!sw){sw=true;draw(to,arg)}
    if(p<1)requestAnimationFrame(f);
    else setTimeout(()=>{L.classList.remove("on");busy=false;const h=$("#view h1");if(h)h.focus({preventScroll:true})},220);
  })(t0);
}
$("#links").innerHTML=NAV.map(n=>`<button data-go="${n[0]}">${n[1]}</button>`).join("");
document.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;const [to,arg]=b.dataset.go.split(":");go(to,arg)});
const cv=$("#petals"),cx=cv.getContext("2d"),col=["#c9a0ff","#9b5de5","#ff9ccf","#e8b93e"];let W,H;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener("resize",size);
const P=Array.from({length:30},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:4+Math.random()*7,s:.3+Math.random()*.8,a:Math.random()*6,w:.005+Math.random()*.02,c:col[i%4]}));
(function tick(){cx.clearRect(0,0,W,H);for(const p of P){if(!rm){p.y+=p.s;p.a+=p.w;p.x+=Math.sin(p.a*3)*.6}if(p.y>H+10){p.y=-10;p.x=Math.random()*W}cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.globalAlpha=.55;cx.fillStyle=p.c;cx.beginPath();cx.ellipse(0,0,p.r,p.r/2,0,0,7);cx.fill();cx.restore()}if(!rm)requestAnimationFrame(tick)})();
go("inicio");
</script>
</body>
</html>
